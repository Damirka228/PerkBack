name: CI

on:
  push:
    branches:
      - main
      - feature/**

permissions:
  contents: read

jobs:
  runner-check:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Check Go
        run: go version
      - name: Check formatting
        run: | 
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...
